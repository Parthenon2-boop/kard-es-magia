name: Kard és Mágia kiadás

# Mit csinál?
#   Godot 4.7.2-vel elkészíti a Windows .exe-t és a macOS .app-ot, majd GitHub-kiadásként
#   (Release) közzéteszi őket. A ParthLauncher innen tölti le és frissíti a játékot.
#
# Mikor fut?
#   1) ha "v" kezdetű címkét (tag) küldesz fel:   git tag v2.0 && git push origin v2.0
#   2) kézzel: a tároló Actions fülén -> "Kard és Mágia kiadás" -> "Run workflow"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verzio:
        description: "A kiadás verziója (pl. v2.0)"
        required: true
        default: "v2.0"

permissions:
  contents: write        # a kiadás közzétételéhez kell

env:
  GODOT_VERSION: "4.7.2"

jobs:
  kiadas:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Godot és az export sablonok telepítése
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: Erőforrások előkészítése (import)
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: Tesztek (pályák bejárhatósága, harc, tárgyak)
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: Exportálás Windowsra (a .pck az .exe-be ágyazva)
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" "$PWD/build/windows/KardEsMagia.exe"
          ls -la build/windows

      - name: Exportálás macOS-re (a Godot a .app csomagot zip-ként készíti el)
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" "$PWD/build/macos/kard_es_magia-macos.zip"
          ls -la build/macos

      - name: Csomagolás
        run: |
          cd build/windows && zip -r ../../kard_es_magia-windows.zip . && cd ../..
          cp build/macos/kard_es_magia-macos.zip .
          ls -la *.zip

      - name: Kiadás közzététele
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.verzio || github.ref_name }}
          name: Kard és Mágia ${{ github.event.inputs.verzio || github.ref_name }}
          make_latest: true
          body: |
            Kard és Mágia – roguelike kaland a katakombákban (Godot 4, natív változat).
            A legegyszerűbb a ParthLauncherből játszani: az letölti és frissíti.

            - **kard_es_magia-windows.zip** – Windows (KardEsMagia.exe, telepítés nélkül)
            - **kard_es_magia-macos.zip** – macOS (Intel és Apple Silicon, univerzális)

            Macen az első indításnál: jobb klikk az alkalmazáson → **Megnyitás** (az alkalmazás
            nincs aláírva, ezért a rendszer rákérdez).
          files: |
            kard_es_magia-windows.zip
            kard_es_magia-macos.zip